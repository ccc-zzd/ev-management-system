{% extends "base.html" %}
{% block title %}车辆详情 - 新能源汽车综合管理系统{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row mb-3">
        <div class="col">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item"><a href="/car_list">车辆列表</a></li>
                    <li class="breadcrumb-item active" id="crumb-model">车辆详情</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row">
        <!-- 车辆基本信息 -->
        <div class="col-lg-7 mb-4">
            <div class="card border-0 shadow-sm">
                <div id="car-img-box" style="height:280px;background:#f5f5f5;border-radius:8px 8px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-ev-front" style="font-size:4rem;color:#ccc;"></i>
                </div>
                <div class="card-body p-4">
                    <h3 class="mb-3" id="car-model">加载中...</h3>
                    <div class="row mb-3">
                        <div class="col-6"><span class="text-muted">品牌：</span><strong id="car-brand"></strong></div>
                        <div class="col-6"><span class="text-muted">车系：</span><strong id="car-series"></strong></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6"><span class="text-muted">官方价格：</span><span class="text-danger fs-4" id="car-price"></span></div>
                        <div class="col-6"><span class="text-muted">续航里程：</span><span class="fs-4" id="car-range"></span></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6"><span class="text-muted">车辆类型：</span><span id="car-type"></span></div>
                        <div class="col-6"><span class="text-muted">状态：</span><span id="car-status"></span></div>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" onclick="bookTestDrive()"><i class="bi bi-calendar-check"></i> 预约试驾</button>
                        <button class="btn btn-success" onclick="buyCar()"><i class="bi bi-cart-plus"></i> 立即购买</button>
                        <button class="btn btn-outline-danger" id="fav-btn" onclick="toggleFavorite()"><i class="bi bi-heart"></i> 收藏</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评分雷达图 -->
        <div class="col-lg-5 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <h5 class="mb-0"><i class="bi bi-graph-up"></i> 综合评分</h5>
                        <span class="badge bg-warning text-dark fs-6 rounded-pill px-3" id="car-total-score">--</span>
                        <small class="text-muted" id="car-score-count">--人评分</small>
                    </div>
                    <div id="radar-chart" style="height: 300px;"></div>
                    <div id="score-dims" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 我的评分 -->
    <div class="card border-0 shadow-sm mb-4" id="review-box">
        <div class="card-body p-4">
            <h5 class="mb-3"><i class="bi bi-star me-2 text-warning"></i>我的评分</h5>
            <div class="row g-3 mb-3" id="review-dims">
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">空间</label>
                    <select class="form-select" id="r-space">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">驾驶</label>
                    <select class="form-select" id="r-drive">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">续航</label>
                    <select class="form-select" id="r-range">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">外观</label>
                    <select class="form-select" id="r-appearance">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">内饰</label>
                    <select class="form-select" id="r-interior">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">性价比</label>
                    <select class="form-select" id="r-value">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label mb-1">智能</label>
                    <select class="form-select" id="r-smart">
                        <option value="1">1分</option><option value="2">2分</option><option value="3" selected>3分</option>
                        <option value="4">4分</option><option value="5">5分</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">评论（选填，最多 500 字）</label>
                <textarea class="form-control" id="review-content" rows="2" maxlength="500" placeholder="说说这款车的空间、续航、驾驶感受..."></textarea>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-primary" onclick="submitReview()"><i class="bi bi-send me-1"></i>提交评价</button>
                <small class="text-muted" id="review-hint"></small>
            </div>
        </div>
    </div>

    <!-- 用户评论 -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <h5 class="mb-3"><i class="bi bi-chat-dots"></i> 用户评论</h5>
            <div id="comments-list">
                <p class="text-muted">暂无评论</p>
            </div>
        </div>
    </div>
</div>

<!-- 下单对话框 -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认购车</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">支付方式</label>
                    <select class="form-select" id="pay-method">
                        <option value="全款">全款</option>
                        <option value="贷款">贷款</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="order-remark" rows="2"></textarea>
                </div>
                <p class="text-muted">订单金额：<strong class="text-danger" id="order-price"></strong></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="submitOrder()">确认下单</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const carName = '{{ car_name }}' || '';
let currentVehicle = null;
let isFavorited = false;

async function loadDetail() {
    if (!carName) { window.location.href = '/car_list'; return; }
    try {
        const res = await fetch(`/api/car_detail?car_name=${encodeURIComponent(carName)}`);
        const json = await res.json();
        if (json.code !== 0) { document.getElementById('car-model').textContent = '加载失败'; alert(json.msg); return; }
        const v = json.data.vehicle;
        const s = json.data.scores || json.data.score;
        currentVehicle = v;

        document.getElementById('car-model').textContent = v.model;
        document.getElementById('crumb-model').textContent = v.model;
        document.getElementById('car-brand').textContent = v.brand;
        document.getElementById('car-series').textContent = v.series;
        document.getElementById('car-price').textContent = v.price ? parseFloat(v.price).toFixed(2) + ' 万元' : '暂无';
        document.getElementById('car-range').textContent = (v.range_cltc || v.range || '-') + ' km';
        document.getElementById('car-type').textContent = v.type || '未知';
        document.getElementById('car-status').textContent = v.status || '在售';

        // 车辆图片
        const imgBox = document.getElementById('car-img-box');
        if (v.image_url) {
            const imgUrl = encodeURI(v.image_url);
            imgBox.innerHTML = '<img src="' + imgUrl + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'<i class=&quot;bi bi-ev-front&quot; style=&quot;font-size:4rem;color:#ccc;&quot;></i>\'">';
        }

    // 雷达图
    if (s && s.avg_space != null) {
        const chart = echarts.init(document.getElementById('radar-chart'));
        chart.setOption({
            radar: {
                indicator: [
                    {name: '空间', max: 5}, {name: '驾驶', max: 5}, {name: '续航', max: 5},
                    {name: '外观', max: 5}, {name: '内饰', max: 5}, {name: '性价比', max: 5}, {name: '智能', max: 5}
                ]
            },
            series: [{
                type: 'radar',
                data: [{
                    value: [s.avg_space||0, s.avg_drive||0, s.avg_range||0, s.avg_appearance||0, s.avg_interior||0, s.avg_value||0, s.avg_smart||0],
                    name: '评分',
                    areaStyle: {color: 'rgba(24,144,255,0.2)'},
                    lineStyle: {color: '#1890ff'}
                }]
            }]
        });
        const total = ((s.avg_space||0)+(s.avg_drive||0)+(s.avg_range||0)+(s.avg_appearance||0)+(s.avg_interior||0)+(s.avg_value||0)+(s.avg_smart||0))/7;
        document.getElementById('car-total-score').textContent = total.toFixed(1) + ' 分';
        document.getElementById('car-score-count').textContent = ((s.score_count != null ? s.score_count : 0)) + ' 人评分';
        // 各维度平均分明细
        const dims = [
            ['空间', s.avg_space], ['驾驶', s.avg_drive], ['续航', s.avg_range],
            ['外观', s.avg_appearance], ['内饰', s.avg_interior], ['性价比', s.avg_value], ['智能化', s.avg_smart]
        ];
        document.getElementById('score-dims').innerHTML = dims.map(([name, val]) => {
            const v = (val != null ? val : 0).toFixed(1);
            return `<div class="d-flex align-items-center justify-content-between small mb-1">
                <span class="text-muted">${name}</span>
                <span><strong>${v}</strong><span class="text-warning ms-1">${'★'.repeat(Math.max(0, Math.min(5, Math.round(val || 0))))}${'☆'.repeat(Math.max(0, 5 - Math.round(val || 0)))}</span></span>
            </div>`;
        }).join('');
    } else {
        document.getElementById('radar-chart').innerHTML = '<p class="text-muted text-center py-5">暂无评分数据</p>';
        document.getElementById('car-total-score').textContent = '暂无';
        document.getElementById('car-score-count').textContent = '0 人评分';
        document.getElementById('score-dims').innerHTML = '';
    }

    // 评论
    const comments = json.data.comments || [];
    const list = document.getElementById('comments-list');
    if (comments.length === 0) {
        list.innerHTML = '<p class="text-muted">暂无评论</p>';
    } else {
        list.innerHTML = comments.map(c => `
            <div class="border-bottom py-2">
                <div class="d-flex gap-2 align-items-center">
                    <i class="bi bi-person-circle text-primary"></i>
                    <strong class="small">${c.username || '车友'}</strong>
                </div>
                <small class="text-muted">${c.comment_date || ''}</small>
                <p class="mb-0 mt-1">${c.content}</p>
            </div>
        `).join('');
    }

    // 回填我的已评
    const mr = json.data.my_review;
    const dimKeys = ['space','drive','range','appearance','interior','value','smart'];
    if (mr) {
        dimKeys.forEach(d => { const el = document.getElementById('r-' + d); if (el) el.value = mr[d + '_score'] || 3; });
        document.getElementById('review-hint').textContent = '您已提交过评价，再次提交将覆盖更新';
    } else {
        document.getElementById('review-hint').textContent = '';
    }

    // 检查收藏状态
    checkFavorite();
    } catch(e) {
        document.getElementById('car-model').textContent = '加载失败: ' + e.message;
    }
}

async function checkFavorite() {
    const res = await fetch('/api/me');
    const json = await res.json();
    if (json.code !== 0) return;
    const favRes = await fetch('/api/my_favorites');
    const favJson = await favRes.json();
    if (favJson.code === 0) {
        isFavorited = favJson.data.some(f => f.vehicle_id === currentVehicle.vehicle_id);
        updateFavBtn();
    }
}

function updateFavBtn() {
    const btn = document.getElementById('fav-btn');
    btn.innerHTML = isFavorited ? '<i class="bi bi-heart-fill"></i> 已收藏' : '<i class="bi bi-heart"></i> 收藏';
    btn.className = isFavorited ? 'btn btn-danger' : 'btn btn-outline-danger';
}

async function toggleFavorite() {
    const me = await (await fetch('/api/me')).json();
    if (me.code !== 0) { alert('请先登录'); window.location.href = '/login'; return; }
    if (isFavorited) {
        await fetch(`/api/favorite/${currentVehicle.vehicle_id}`, {method: 'DELETE'});
        isFavorited = false;
    } else {
        await fetch('/api/favorite', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({vehicle_id: currentVehicle.vehicle_id})});
        isFavorited = true;
    }
    updateFavBtn();
}

function bookTestDrive() {
    window.location.href = `/test_drive?vehicle_id=${currentVehicle.vehicle_id}`;
}

function buyCar() {
    fetch('/api/me').then(r=>r.json()).then(json => {
        if (json.code !== 0) { alert('请先登录'); window.location.href = '/login'; return; }
        document.getElementById('order-price').textContent = currentVehicle.price + ' 万元';
        new bootstrap.Modal(document.getElementById('orderModal')).show();
    });
}

async function submitOrder() {
    const payMethod = document.getElementById('pay-method').value;
    const remark = document.getElementById('order-remark').value;
    const res = await fetch('/api/order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({vehicle_id: currentVehicle.vehicle_id, pay_method: payMethod, remark: remark})
    });
    const json = await res.json();
    if (json.code === 0) {
        alert('下单成功！');
        bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
        window.location.href = '/my_orders';
    } else {
        alert(json.msg);
    }
}

async function submitReview() {
    const me = await (await fetch('/api/me')).json();
    if (me.code !== 0) { alert('请先登录'); window.location.href = '/login'; return; }
    const dimKeys = ['space','drive','range','appearance','interior','value','smart'];
    const body = {
        model: currentVehicle.model,
        brand: currentVehicle.brand,
        series: currentVehicle.series,
        content: document.getElementById('review-content').value
    };
    dimKeys.forEach(d => { body[d + '_score'] = parseInt(document.getElementById('r-' + d).value, 10); });
    const res = await fetch('/api/car_detail/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    const json = await res.json();
    if (json.code === 0) {
        alert('评价已提交，感谢分享！');
        loadDetail();
    } else {
        alert(json.msg);
    }
}

loadDetail();
</script>
{% endblock %}
