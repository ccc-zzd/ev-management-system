{% extends "base.html" %}
{% block title %}我的试驾预约 - 新能源汽车综合管理系统{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h2><i class="bi bi-calendar-check me-2"></i>我的试驾预约</h2>
        <p>查看您所有试驾预约记录</p>
    </div>
    <a href="/test_drive" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>新建预约</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>车型</th><th>试驾日期</th><th>时段</th><th>状态</th><th>联系方式</th><th>备注</th><th>操作</th></tr></thead>
                <tbody id="drivesBody">
                    <tr><td colspan="7" class="text-center text-muted py-4"><i class="bi bi-arrow-repeat spin me-2"></i>加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    .badge-status { font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; }
</style>
{% endblock %}

{% block extra_js %}
<script>
    const statusMap = {
        '待确认': 'warning',
        '已确认': 'primary',
        '已完成': 'success',
        '已取消': 'secondary'
    };

    async function loadDrives() {
        const data = await apiRequest('/api/my_drives');
        const tbody = document.getElementById('drivesBody');
        if (!data || data.code === 401) return;
        if (!data || data.code !== 0 || !data.data || data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">暂无试驾预约记录<a href="/test_drive" class="ms-2">去预约</a></td></tr>';
            return;
        }
        tbody.innerHTML = data.data.map(d => {
            const carName = [d.brand, d.series, d.model].filter(Boolean).join(' ') || '未知车型';
            const badge = '<span class="badge-status bg-' + (statusMap[d.status] || 'secondary') + '">' + (d.status || '') + '</span>';
            const cancelBtn = d.status === '待确认'
                ? '<button class="btn btn-outline-danger btn-sm" onclick="cancelDrive(' + d.drive_id + ')">取消</button>'
                : '';
            return '<tr>'
                + '<td>' + carName + '</td>'
                + '<td>' + (d.drive_date || '') + '</td>'
                + '<td>' + (d.drive_time || '') + '</td>'
                + '<td>' + badge + '</td>'
                + '<td>' + (d.contact_phone || '-') + '</td>'
                + '<td><small>' + (d.remark || '-') + '</small></td>'
                + '<td>' + cancelBtn + '</td>'
                + '</tr>';
        }).join('');
    }

    async function cancelDrive(driveId) {
        if (!confirm('确定取消该预约吗？')) return;
        const data = await apiRequest('/api/test_drive/' + driveId + '/cancel', { method: 'PUT' });
        if (data && data.code === 0) {
            showToast('预约已取消', 'info');
            loadDrives();
        } else {
            showToast(data ? data.msg : '操作失败', 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadDrives);
</script>
{% endblock %}
