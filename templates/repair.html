{% extends "base.html" %}
{% block title %}售后报修 - 新能源汽车综合管理系统{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-wrench me-2"></i>售后报修</h2>
    <p>提交车辆故障报修，享受快捷售后服务</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div id="repairAlert"></div>
                <form id="repairForm" onsubmit="doRepair(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold"><i class="bi bi-car-front me-1"></i>选择车辆 <span class="text-danger">*</span></label>
                        <select class="form-select" id="vehicleId" required>
                            <option value="">请选择车辆...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold"><i class="bi bi-tag me-1"></i>故障类型</label>
                        <select class="form-select" id="repairType">
                            <option value="电池故障">电池故障</option>
                            <option value="电机故障">电机故障</option>
                            <option value="充电故障">充电故障</option>
                            <option value="车身故障">车身故障</option>
                            <option value="电子系统">电子系统</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold"><i class="bi bi-chat-left-dots me-1"></i>故障描述 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="problemDesc" rows="4" required placeholder="请详细描述故障情况"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                            <i class="bi bi-send me-1"></i>提交报修
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
</style>
{% endblock %}

{% block extra_js %}
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const presetVehicleId = urlParams.get('vehicle_id') || '';

    async function loadVehicles() {
        const data = await apiRequest('/api/vehicles?limit=2000');
        const sel = document.getElementById('vehicleId');
        if (!data || data.code !== 0) {
            sel.innerHTML = '<option value="">车辆加载失败</option>';
            return;
        }
        let options = '<option value="">请选择车辆...</option>';
        (data.data || []).forEach(v => {
            const name = v.brand + ' ' + (v.series || '') + ' ' + v.model;
            const selected = presetVehicleId && presetVehicleId === v.vehicle_id ? ' selected' : '';
            options += '<option value="' + v.vehicle_id + '"' + selected + '>' + name + '</option>';
        });
        sel.innerHTML = options;
    }

    async function doRepair(e) {
        e.preventDefault();
        const vehicle_id = document.getElementById('vehicleId').value;
        const repair_type = document.getElementById('repairType').value;
        const problem_desc = document.getElementById('problemDesc').value.trim();

        if (!requireLogin('请先登录后再提交报修')) return;
        if (!vehicle_id || !problem_desc) {
            document.getElementById('repairAlert').innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-1"></i>请选择车辆并填写故障描述</div>';
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-1"></i>提交中...';
        const res = await fetch('/api/repair', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vehicle_id, repair_type, problem_desc })
        });
        const data = await res.json();
        if (data.code === 0) {
            showToast('报修提交成功！', 'success');
            setTimeout(() => { window.location.href = '/my_repairs'; }, 800);
        } else {
            document.getElementById('repairAlert').innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle me-1"></i>' + (data.msg || '提交失败') + '</div>';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send me-1"></i>提交报修';
        }
    }

    document.addEventListener('DOMContentLoaded', loadVehicles);
</script>
{% endblock %}
